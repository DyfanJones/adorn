project:
  type: website
  output-dir: ../docs/

# litedown prints "#>" before output; match that under knitr.
knitr:
  opts_chunk:
    collapse: true
    comment: "#>"

website:
  title: "$ALTDOC_PACKAGE_NAME"
  favicon: logo.png
  page-footer:
    left: "MIT licensed. Built with altdoc and Quarto."
    right: "$ALTDOC_PACKAGE_NAME"
  navbar:
    logo: logo.png
    search: true
    right:
      - icon: github
        href: $ALTDOC_PACKAGE_URL_GITHUB
        aria-label: $ALTDOC_PACKAGE_NAME GitHub
  sidebar:
    collapse-level: 1
    contents:
      - text: Home
        file: index.md
      - section: $ALTDOC_VIGNETTE_BLOCK
      - section: $ALTDOC_MAN_BLOCK
      - text: News
        file: $ALTDOC_NEWS
      - text: Changelog
        file: $ALTDOC_CHANGELOG
      - text: License
        file: $ALTDOC_LICENSE
      - text: Licence
        file: $ALTDOC_LICENCE
      - text: Code of conduct
        file: $ALTDOC_CODE_OF_CONDUCT
      - text: Citation
        file: $ALTDOC_CITATION
  llms-txt: true
  
format:
  html:
    code-link: true
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    toc-location: right
    smooth-scroll: true
    highlight-style: a11y
    theme:
      light: [flatly, custom.scss]
      dark: [darkly, dark.scss, custom.scss]

