# Builds the altdoc Quarto website and deploys it to GitHub Pages.
# Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: docs.yaml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::altdoc, any::knitr, any::rmarkdown

      # The vignettes call library(adorn), so install the package itself.
      - name: Install package
        run: R CMD INSTALL .

      - name: Render site
        run: altdoc::render_docs(verbose = TRUE)
        shell: Rscript {0}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
